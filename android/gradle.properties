android.useAndroidX=true

# Android Gradle Plugin 8.x / Gradle 8.x must run on a modern JVM.
# Pin Gradle to Android Studio's bundled JBR so stale Java 8 daemons cannot
# trigger "Dependency requires at least JVM runtime version 11" errors.
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

# Keep the Gradle JVM small enough for 8 GB Windows laptops.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Kotlin compiler - in-process mode.
# This avoids the separate Kotlin daemon socket on Windows.
kotlin.compiler.execution.strategy=in-process

# Disable incremental compilation because the Kotlin daemon is disabled.
kotlin.incremental=false

# Keep builds conservative on low-memory development machines.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.daemon=false
